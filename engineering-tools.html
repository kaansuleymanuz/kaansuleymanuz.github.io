const root=document.getElementById("tools");
function renderTools(){
root.replaceChildren();
const match=location.hash.match(/^#tool-(\d+)$/);
const selected=match?Number(match[1]):-1;
if(selected<0||selected>=defs.length){
const link=document.createElement("a");link.className="btn secondary";link.href="simulations.html";link.dataset.tr="Hesaplama aracı seçin";link.dataset.en="Select a calculator";link.textContent=document.documentElement.lang==="en"?link.dataset.en:link.dataset.tr;root.append(link);return;

defs.forEach((d,i)=>{if(i!==selected)return;const card=document.createElement('article');card.className='card';card.id='tool-'+i;const h=document.createElement('h3');h.dataset.tr=d[0];h.dataset.en=d[1];h.textContent=document.documentElement.lang==='en'?d[1]:d[0];card.append(h);const form=document.createElement('form');d[2].forEach((l,j)=>{const label=document.createElement('label');label.style.display='block';label.textContent=l;const input=document.createElement('input');input.type='number';input.step='any';input.required=true;input.value=d[3][j];input.style.cssText='display:block;width:100%;padding:8px;margin:5px 0 10px;border:1px solid var(--border);background:var(--card);color:var(--fg)';label.append(input);form.append(label)});const btn=document.createElement('button');btn.className='btn secondary';btn.dataset.tr='Hesapla';btn.dataset.en='Calculate';btn.textContent=document.documentElement.lang==='en'?'Calculate':'Hesapla';form.append(btn);const out=document.createElement('p');out.setAttribute('aria-live','polite');const note=document.createElement('p');note.textContent=d[5];note.style.fontSize='.85rem';form.addEventListener('submit',ev=>{ev.preventDefault();try{const vals=[...form.querySelectorAll('input')].map(x=>x.valueAsNumber);if(!vals.every(Number.isFinite))throw 0;const result=compute[i](...vals);if(!Number.isFinite(result))throw 0;out.textContent=new Intl.NumberFormat(document.documentElement.lang,{maximumFractionDigits:4}).format(result)}catch{out.textContent=document.documentElement.lang==='en'?'Check input values.':'Giriş değerlerini kontrol edin.'}});card.append(form,out,note);root.append(card);form.requestSubmit()});
}
