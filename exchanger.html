<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isı değiştiricisi – LMTD</title><script defer src="navigation.js?v=65"></script><style>body{font:17px Arial;max-width:850px;margin:auto;padding:24px;background:#fffaf6;color:#29221e}h1{color:#a83104}label{display:block;margin:12px 0}input{display:block;padding:10px;width:95%;font:inherit;border:1px solid #aaa;border-radius:6px}output{display:block;background:#fce6d5;padding:20px;margin:24px 0;font-size:22px;font-weight:bold}a{color:#a83104}</style><h1>Isı değiştiricisi – LMTD</h1><p>Karşı akışlı ideal ısı değiştiricisi: Q = UAΔTlm. Enerji dengesi ayrıca doğrulanmalıdır.</p><label>Sıcak giriş (°C)<input id="hi" type="number" step="any" value="80"></label><label>Sıcak çıkış (°C)<input id="ho" type="number" step="any" value="60"></label><label>Soğuk giriş (°C)<input id="ci" type="number" step="any" value="20"></label><label>Soğuk çıkış (°C)<input id="co" type="number" step="any" value="40"></label><label>Toplam katsayı (W/m²K)<input id="U" type="number" step="any" value="300"></label><label>Alan (m²)<input id="A" type="number" step="any" value="2"></label><output id="result"></output><p>Eğitim amaçlı analitik hesaplayıcı; CFD çözümü değildir.</p><a href="simulations.html">← Laboratuvar</a><script>function calc(){const hi=document.getElementById("hi").valueAsNumber;const ho=document.getElementById("ho").valueAsNumber;const ci=document.getElementById("ci").valueAsNumber;const co=document.getElementById("co").valueAsNumber;const U=document.getElementById("U").valueAsNumber;const A=document.getElementById("A").valueAsNumber;if(![hi,ho,ci,co,U,A].every(Number.isFinite))return "Geçerli sayı girin.";const a=hi-co,b=ho-ci;if(a<=0||b<=0||hi<ho||co<ci||U<=0||A<=0)return "Sıcaklıkları ve pozitif U, A değerlerini kontrol edin.";const l=Math.abs(a-b)<1e-9?a:(a-b)/Math.log(a/b);return `LMTD = ${l.toFixed(2)} K | Q = ${(U*A*l).toFixed(1)} W`}function update(){document.getElementById('result').textContent=calc()}document.addEventListener('input',update);update();</script></html>
