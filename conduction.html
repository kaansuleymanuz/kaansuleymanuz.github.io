<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Düz duvarda ısı iletimi</title><style>body{font:17px Arial;max-width:850px;margin:auto;padding:24px;background:#fffaf6;color:#29221e}h1{color:#a83104}label{display:block;margin:12px 0}input{display:block;padding:10px;width:95%;font:inherit;border:1px solid #aaa;border-radius:6px}output{display:block;background:#fce6d5;padding:20px;margin:24px 0;font-size:22px;font-weight:bold}a{color:#a83104}</style><h1>Düz duvarda ısı iletimi</h1><p>Kararlı, tek boyutlu iletim; sabit k, ısı üretimi yok. Q = kA(T1−T2)/L.</p><label>Isı iletim katsayısı (W/mK)<input id="k" type="number" step="any" value="0.8"></label><label>Alan (m²)<input id="A" type="number" step="any" value="1"></label><label>Kalınlık (m)<input id="L" type="number" step="any" value="0.1"></label><label>Sol yüzey (°C)<input id="T1" type="number" step="any" value="80"></label><label>Sağ yüzey (°C)<input id="T2" type="number" step="any" value="20"></label><output id="result"></output><p>Eğitim amaçlı analitik hesaplayıcı; CFD çözümü değildir.</p><a href="simulations.html">← Laboratuvar</a><script>function calc(){const k=document.getElementById("k").valueAsNumber;const A=document.getElementById("A").valueAsNumber;const L=document.getElementById("L").valueAsNumber;const T1=document.getElementById("T1").valueAsNumber;const T2=document.getElementById("T2").valueAsNumber;if(![k,A,L,T1,T2].every(Number.isFinite))return "Geçerli sayı girin.";if(k<=0||A<=0||L<=0)return "Pozitif k, A ve L girin.";return `Q = ${(k*A*(T1-T2)/L).toFixed(2)} W | R = ${(L/(k*A)).toFixed(4)} K/W`}function update(){document.getElementById('result').textContent=calc()}document.addEventListener('input',update);update();</script></html>
