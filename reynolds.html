<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boru içi akış ve Reynolds</title><style>body{font:17px Arial;max-width:850px;margin:auto;padding:24px;background:#fffaf6;color:#29221e}h1{color:#a83104}label{display:block;margin:12px 0}input{display:block;padding:10px;width:95%;font:inherit;border:1px solid #aaa;border-radius:6px}output{display:block;background:#fce6d5;padding:20px;margin:24px 0;font-size:22px;font-weight:bold}a{color:#a83104}</style><h1>Boru içi akış ve Reynolds</h1><p>Re = ρVD/μ. Dairesel boru için yaklaşık rejim sınırları 2300 ve 4000.</p><label>Ortalama hız (m/s)<input id="u" type="number" step="any" value="1"></label><label>Çap (mm)<input id="d" type="number" step="any" value="10"></label><label>Yoğunluk (kg/m³)<input id="rho" type="number" step="any" value="998"></label><label>Dinamik viskozite (Pa·s)<input id="mu" type="number" step="any" value="0.001"></label><output id="result"></output><p>Eğitim amaçlı analitik hesaplayıcı; CFD çözümü değildir.</p><a href="simulations.html">← Laboratuvar</a><script>function calc(){const u=document.getElementById("u").valueAsNumber;const d=document.getElementById("d").valueAsNumber;const rho=document.getElementById("rho").valueAsNumber;const mu=document.getElementById("mu").valueAsNumber;if(![u,d,rho,mu].every(Number.isFinite))return "Geçerli sayı girin.";if(d<=0||rho<=0||mu<=0||u<0)return "Pozitif fiziksel değerler girin.";const r=u*(d/1000)*rho/mu; return `Re = ${r.toFixed(1)} | ${r<2300?"Laminer":r<4000?"Geçiş":"Türbülanslı"}`}function update(){document.getElementById('result').textContent=calc()}document.addEventListener('input',update);update();</script></html>
